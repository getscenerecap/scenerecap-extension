<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Review recording — SceneRecap</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F2EB; color: #14130F; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 20px; color: #14130F; }
    video { width: 100%; border-radius: 12px; border: 1px solid rgba(20,19,15,.16); background: #000; margin: 16px 0; }
    .meta { font-size: 12px; color: #625E56; margin-bottom: 16px; }
    input, select { background: #FFFFFF; color: #14130F; border: 1px solid rgba(20,19,15,.18); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 12px; }
    select { margin-bottom: 16px; }
    .actions { display: flex; gap: 10px; }
    button { border: 0; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
    #upload { background: #14130F; color: #F5F2EB; }
    #upload:hover { background: #26241F; }
    #upload:disabled { opacity: 0.5; }
    #save { background: transparent; color: #3D3A33; border: 1px solid rgba(20,19,15,.16); }
    #status { margin-top: 14px; font-size: 13px; color: #5F5B53; min-height: 18px; }
    #status a { color: #2340C6; }
    .privacy { margin-top: 24px; font-size: 11px; color: #5F5B53; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Review your recording</h1>
    <video id="preview" controls></video>
    <div class="meta" id="meta"></div>
    <input id="title-input" placeholder="Title (SceneRecap will suggest one after analysis)" />
    <select id="mode">
      <option value="explain">Explain — what happened</option>
      <option value="bug_report">Bug report — repro steps</option>
      <option value="tutorial">Tutorial — step-by-step</option>
      <option value="recap">Recap — decisions & actions</option>
    </select>
    <div class="actions">
      <button id="upload">Upload & analyze</button>
      <button id="save">Save video to disk</button>
    </div>
    <div id="status"></div>
    <p class="privacy">Passwords are never captured. Plain typing is never logged — only clicks, navigation, and shortcuts. You can delete any recording (and its data) at any time from the dashboard.</p>
  </div>
  <script src="review.js"></script>
</body>
</html>
