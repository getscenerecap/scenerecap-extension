<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Review recording — SceneRecap</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0a0b0c; color: #e4e4e7; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 20px; color: #fff; }
    video { width: 100%; border-radius: 12px; border: 1px solid #23272b; background: #000; margin: 16px 0; }
    .meta { font-size: 12px; color: #71717a; margin-bottom: 16px; }
    input, select { background: #111315; color: #e4e4e7; border: 1px solid #23272b; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 12px; }
    select { margin-bottom: 16px; }
    .actions { display: flex; gap: 10px; }
    button { border: 0; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
    #upload { background: #17c9a8; color: #0a0b0c; }
    #upload:hover { background: #3ee0c1; }
    #upload:disabled { opacity: 0.5; }
    #save { background: transparent; color: #d4d4d8; border: 1px solid #23272b; }
    #status { margin-top: 14px; font-size: 13px; color: #a1a1aa; min-height: 18px; }
    #status a { color: #3ee0c1; }
    .privacy { margin-top: 24px; font-size: 11px; color: #52525b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Review your recording</h1>
    <video id="preview" controls></video>
    <div class="meta" id="meta"></div>
    <input id="title-input" placeholder="Title (SceneRecap will suggest one after analysis)" />
    <select id="mode">
      <option value="explain">Explain — what happened</option>
      <option value="bug_report">Bug report — repro steps</option>
      <option value="tutorial">Tutorial — step-by-step</option>
      <option value="recap">Recap — decisions & actions</option>
    </select>
    <div class="actions">
      <button id="upload">Upload & analyze</button>
      <button id="save">Save video to disk</button>
    </div>
    <div id="status"></div>
    <p class="privacy">Passwords are never captured. Plain typing is never logged — only clicks, navigation, and shortcuts. You can delete any recording (and its data) at any time from the dashboard.</p>
  </div>
  <script src="review.js"></script>
</body>
</html>
