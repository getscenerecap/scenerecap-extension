<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: dark; }
    body { width: 300px; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #F5F2EB; color: #14130F; }
    .wrap { padding: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; color: #14130F; margin-bottom: 14px; }
    .logo .accent { color: #2340C6; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: #5F5B53; }
    select, .btn { width: 100%; box-sizing: border-box; }
    select { background: #FFFFFF; color: #14130F; border: 1px solid rgba(20,19,15,.18); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
    label.mic { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #5F5B53; margin-bottom: 14px; }
    .btn { border: 0; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn.start { background: #14130F; color: #F5F2EB; }
    .btn.start:hover { background: #26241F; }
    .btn.stop { background: #dc2626; color: #fff; }
    .hint { margin-top: 10px; font-size: 11px; color: #625E56; text-align: center; min-height: 14px; }
    #auth-row { font-size: 11px; color: #625E56; margin-top: 12px; text-align: center; }
    #auth-row a { color: #2340C6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 32 32" fill="none"><path d="M12 6.75 H10 A3 3 0 0 0 7 9.75 V22.25 A3 3 0 0 0 10 25.25 H12" stroke="#14130F" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M20 6.75 H22 A3 3 0 0 1 25 9.75 V22.25 A3 3 0 0 1 22 25.25 H20" stroke="#14130F" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="16" cy="16" r="3.4" fill="#2B4BE0"/></svg>
      Scene<span class="accent">Recap</span>
    </div>
    <div class="row"><span>AI mode</span></div>
    <select id="mode">
      <option value="explain">Explain — what happened</option>
      <option value="bug_report">Bug report — repro steps</option>
      <option value="tutorial">Tutorial — step-by-step</option>
      <option value="recap">Recap — decisions & actions</option>
    </select>
    <label class="mic"><input type="checkbox" id="mic" /> Include microphone</label>
    <button class="btn start" id="record">● Record this tab</button>
    <div class="hint" id="hint"></div>
    <div id="auth-row"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
